<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><link rel="manifest" href="manifest.json"><title>BAAKO • Agenda</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#f5f5f5;font-family:Arial,sans-serif}main{max-width:760px;margin:auto;padding:28px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292929;padding-bottom:28px}.logo{font-size:40px;font-weight:800;letter-spacing:5px}.sub{color:#aaa;letter-spacing:7px;margin-top:5px}.btn{border:0;border-radius:18px;padding:15px 22px;font-size:17px;font-weight:700;background:#fff;color:#080808}.stats{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:36px 0}.card,.item{border:1px solid #292929;background:#101010;border-radius:28px;padding:25px}.label{color:#999;font-size:15px}.num{font-size:38px;font-weight:800;margin-top:12px}.filters{display:flex;gap:14px;margin-bottom:22px}.filter{background:#101010;color:#bbb;border:1px solid #292929;border-radius:18px;padding:14px 22px;font-size:17px;font-weight:700}.active{background:#fff;color:#090909}.empty{text-align:center;color:#777;border:1px dashed #333;border-radius:28px;padding:70px 20px}.item{margin-bottom:16px}.row{display:flex;justify-content:space-between;gap:10px}.name{font-size:23px;font-weight:800}.price{font-size:22px;font-weight:800}.meta,.note{color:#aaa;margin-top:10px}.actions{display:flex;gap:12px;margin-top:22px}.edit,.del{padding:12px 20px;border-radius:16px;border:1px solid #333;background:#191919;color:#fff;font-weight:700}.del{color:#ffb0b0;background:#210c0c}dialog{width:min(92%,520px);background:#111;color:#fff;border:1px solid #333;border-radius:25px;padding:24px}dialog::backdrop{background:#000b}label{display:block;color:#aaa;margin:14px 0 7px}input,textarea{width:100%;padding:14px;border-radius:13px;border:1px solid #333;background:#070707;color:#fff;font-size:16px}textarea{min-height:90px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}@media(max-width:500px){.logo{font-size:31px}.stats{gap:10px}.card{padding:18px}.num{font-size:31px}.filters{overflow:auto}.filter{white-space:nowrap}}
</style></head><body><main><div class="top"><div><div class="logo">BAAKO</div><div class="sub">tattoo • AGENDA</div></div><button class="btn" onclick="openNew()">+ Novo</button></div><section class="stats"><div class="card"><div class="label">AGENDAMENTOS</div><div class="num" id="count">0</div></div><div class="card"><div class="label">VALOR</div><div class="num" id="total">R$ 0,00</div></div></section><div class="filters"><button class="filter active" data-f="all">Todos</button><button class="filter" data-f="today">Hoje</button><button class="filter" data-f="future">Próximos</button></div><div id="list"></div></main><dialog id="dlg"><h2 id="title">Novo agendamento</h2><form id="form"><input type="hidden" id="id"><label>Nome do cliente</label><input id="name" required><label>Data</label><input id="date" type="date" required><label>Horário</label><input id="time" type="time" required><label>Valor (R$)</label><input id="price" type="number" min="0" step="0.01" required><label>Observação</label><textarea id="note" placeholder="Ex.: tatuagem na panturrilha em estilo dark"></textarea><div class="modal-actions"><button type="button" class="filter" onclick="dlg.close()">Cancelar</button><button class="btn">Salvar</button></div></form></dialog><script>const KEY='baako_agenda_v1';let data=JSON.parse(localStorage.getItem(KEY)||'[]'),filter='all';const $=id=>document.getElementById(id),money=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function openNew(){form.reset();$('id').value='';$('title').textContent='Novo agendamento';$('date').value=new Date().toISOString().slice(0,10);dlg.showModal()}function edit(id){let x=data.find(a=>a.id===id);$('id').value=x.id;$('name').value=x.name;$('date').value=x.date;$('time').value=x.time;$('price').value=x.price;$('note').value=x.note||'';$('title').textContent='Editar agendamento';dlg.showModal()}function del(id){if(confirm('Excluir este agendamento?')){data=data.filter(a=>a.id!==id);save()}}form.onsubmit=e=>{e.preventDefault();let x={id:$('id').value||crypto.randomUUID(),name:$('name').value.trim(),date:$('date').value,time:$('time').value,price:Number($('price').value),note:$('note').value.trim()};let i=data.findIndex(a=>a.id===x.id);i<0?data.push(x):data[i]=x;save();dlg.close()};document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.f||filter;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});function render(){let today=new Date().toISOString().slice(0,10),arr=[...data].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));if(filter==='today')arr=arr.filter(x=>x.date===today);if(filter==='future')arr=arr.filter(x=>x.date>=today);$('count').textContent=data.length;$('total').textContent=money(data.reduce((s,x)=>s+x.price,0));if(!arr.length){$('list').innerHTML='<div class="empty">Nenhum agendamento por aqui.<br><br>Toque em <b>+ Novo</b> para começar.</div>';return}$('list').innerHTML=arr.map(x=>`<div class="item"><div class="row"><div class="name">${esc(x.name)}</div><div class="price">${money(x.price)}</div></div><div class="meta">${new Date(x.date+'T12:00').toLocaleDateString('pt-BR')} • ${x.time}</div>${x.note?`<div class="note">${esc(x.note)}</div>`:''}<div class="actions"><button class="edit" onclick="edit('${x.id}')">Editar</button><button class="del" onclick="del('${x.id}')">Excluir</button></div></div>`).join('')}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>

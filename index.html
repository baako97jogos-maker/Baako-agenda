<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="description" content="Agenda BAAKO tattoo">
<link rel="manifest" href="manifest.json">
<title>BAAKO tattoo — Agenda</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f5;font-family:Arial,sans-serif}
header{padding:28px 18px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #242424}
.brand{font-size:24px;font-weight:800;letter-spacing:2px}.brand span{display:block;font-size:11px;font-weight:400;letter-spacing:4px;color:#999;margin-top:4px}
button{border:0;border-radius:12px;padding:12px 15px;font-weight:700;cursor:pointer}.primary{background:#f2f2f2;color:#080808}
main{max-width:720px;margin:auto;padding:18px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.card{background:#111;border:1px solid #242424;border-radius:16px;padding:16px}.label{color:#999;font-size:12px}.num{font-size:23px;font-weight:800;margin-top:6px}
.filters{display:flex;gap:8px;margin:12px 0;overflow:auto}.filter{background:#121212;color:#bbb;border:1px solid #282828}.filter.active{background:#eee;color:#080808}
.empty{padding:45px 20px;text-align:center;color:#777;border:1px dashed #292929;border-radius:16px}
.item{background:#111;border:1px solid #262626;border-radius:16px;padding:16px;margin:10px 0}.top{display:flex;justify-content:space-between;gap:10px}.name{font-size:17px;font-weight:800}.date{color:#aaa;font-size:13px;margin-top:6px}.price{font-weight:800}.note{color:#aaa;font-size:13px;margin-top:10px}.actions{display:flex;gap:8px;margin-top:13px}.secondary{background:#1b1b1b;color:#eee;border:1px solid #303030}.danger{background:#211010;color:#ffb0b0}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;padding:12px}.modal.show{display:flex}.sheet{background:#111;border:1px solid #292929;border-radius:20px 20px 14px 14px;width:100%;max-width:720px;padding:20px;max-height:90vh;overflow:auto}
h2{margin:0 0 18px}label{display:block;color:#aaa;font-size:12px;margin:13px 0 6px}input,textarea{width:100%;padding:13px;background:#090909;border:1px solid #303030;color:#fff;border-radius:11px;font-size:16px}textarea{min-height:80px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-actions{display:flex;gap:10px;margin-top:20px}.modal-actions button{flex:1}
</style>
</head>
<body>
<header><div class="brand">BAAKO<span>tattoo • AGENDA</span></div><button class="primary" id="newBtn">+ Novo</button></header>
<main>
<section class="stats"><div class="card"><div class="label">AGENDAMENTOS</div><div class="num" id="count">0</div></div><div class="card"><div class="label">VALOR</div><div class="num" id="total">R$ 0,00</div></div></section>
<div class="filters"><button class="filter active" data-filter="all">Todos</button><button class="filter" data-filter="today">Hoje</button><button class="filter" data-filter="future">Próximos</button></div>
<section id="list"></section>
</main>
<div class="modal" id="modal"><div class="sheet">
<h2 id="modalTitle">Novo agendamento</h2>
<input type="hidden" id="editId">
<label>Nome do cliente</label><input id="name" placeholder="Ex.: João Silva">
<div class="row"><div><label>Data</label><input id="date" type="date"></div><div><label>Horário</label><input id="time" type="time"></div></div>
<label>Valor</label><input id="price" type="number" min="0" step="0.01" placeholder="350">
<label>Observação (opcional)</label><textarea id="note" placeholder="Tamanho, região, ideia..."></textarea>
<div class="modal-actions"><button class="secondary" id="cancelBtn">Cancelar</button><button class="primary" id="saveBtn">Salvar</button></div>
</div></div>
<script>
const KEY='baako_agenda_v1'; let data=JSON.parse(localStorage.getItem(KEY)||'[]'); let filter='all';
const $=id=>document.getElementById(id);
const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0);
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function render(){
 let now=new Date(), today=now.toISOString().slice(0,10);
 let arr=data.filter(x=>filter==='all'||(filter==='today'&&x.date===today)||(filter==='future'&&x.date>=today))
 .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 $('count').textContent=arr.length; $('total').textContent=money(arr.reduce((s,x)=>s+Number(x.price||0),0));
 $('list').innerHTML=arr.length?arr.map(x=>`<article class="item"><div class="top"><div><div class="name">${esc(x.name)}</div><div class="date">${fmtDate(x.date)} • ${x.time||'—'}</div></div><div class="price">${money(x.price)}</div></div>${x.note?`<div class="note">${esc(x.note)}</div>`:''}<div class="actions"><button class="secondary" onclick="edit('${x.id}')">Editar</button><button class="danger" onclick="removeItem('${x.id}')">Excluir</button></div></article>`).join(''):'<div class="empty">Nenhum agendamento por aqui.<br><br>Toque em <b>+ Novo</b> para começar.</div>';
}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function fmtDate(d){if(!d)return'—';let [y,m,day]=d.split('-');return `${day}/${m}/${y}`}
function openNew(){
 $('modalTitle').textContent='Novo agendamento';$('editId').value='';$('name').value='';$('date').value=new Date().toISOString().slice(0,10);$('time').value='';$('price').value='';$('note').value='';$('modal').classList.add('show');
}
function edit(id){let x=data.find(a=>a.id===id);if(!x)return;$('modalTitle').textContent='Editar agendamento';$('editId').value=x.id;$('name').value=x.name;$('date').value=x.date;$('time').value=x.time;$('price').value=x.price;$('note').value=x.note||'';$('modal').classList.add('show')}
function removeItem(id){if(confirm('Excluir este agendamento?')){data=data.filter(x=>x.id!==id);save();render()}}
$('newBtn').onclick=openNew;$('cancelBtn').onclick=()=> $('modal').classList.remove('show');
$('saveBtn').onclick=()=>{let name=$('name').value.trim(),date=$('date').value,time=$('time').value,price=$('price').value,note=$('note').value.trim();if(!name||!date||!time){alert('Preencha nome, data e horário.');return}
let id=$('editId').value;if(id){let x=data.find(a=>a.id===id);Object.assign(x,{name,date,time,price,note})}else data.push({id:Date.now().toString(),name,date,time,price,note});save();$('modal').classList.remove('show');render()};
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
